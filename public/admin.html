<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ResumeBuilderAI Admin</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">📄</span>
      <span class="brand-name">Resume<b>BuilderAI</b></span>
    </a>
    <nav class="mainnav">
      <a class="mainnav-item" href="index.html" style="display:flex; align-items:center;">← Back to site</a>
    </nav>
    <div class="topbar-cta"><span class="status-pill">ADMIN</span></div>
  </div>
</header>

<main class="shell">
  <h1>Admin</h1>
  <p class="section-sub">Business overview + subscriber activation.</p>

  <div class="panel">
    <div class="row">
      <input type="password" id="adminKey" placeholder="Admin key" />
      <button id="loadBtn">Load dashboard</button>
    </div>
  </div>

  <div class="hero-stats" id="statsRow" style="margin:20px 0;"></div>

  <div class="panel">
    <div class="row">
      <input type="email" id="quickEmail" placeholder="email to activate" />
      <select id="quickPlan"><option value="starter">Starter (R49)</option><option value="pro">Pro (R69)</option><option value="premium">Premium (R89)</option></select>
      <input type="number" id="quickDays" placeholder="days" value="30" style="max-width:100px; min-width:100px;" />
      <button id="activateBtn">Activate</button>
    </div>
  </div>

  <div class="panel">
    <table class="admin-table">
      <thead><tr><th>Email</th><th>Plan</th><th>Status</th><th>Expires</th><th>Tailorings used</th><th>Action</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<footer class="footer"><div class="footer-inner"><div><strong>ResumeBuilderAI</strong> Admin</div></div></footer>

<script>
  const keyInput = document.getElementById('adminKey');
  keyInput.value = localStorage.getItem('rba_admin_key') || '';

  async function api(path, opts = {}) {
    const key = keyInput.value.trim();
    localStorage.setItem('rba_admin_key', key);
    const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'x-admin-key': key, ...(opts.headers || {}) } });
    return res.json();
  }

  async function loadStats() {
    const data = await api('/api/admin/stats');
    const host = document.getElementById('statsRow');
    if (!data.users) { host.innerHTML = `<div class="note">${data.error || 'error loading stats'}</div>`; return; }
    host.innerHTML = `
      <div class="stat-chip"><div class="n">${data.users.total}</div><div class="l">Registered users</div></div>
      <div class="stat-chip"><div class="n">${data.users.active}</div><div class="l">Active subs</div></div>
      <div class="stat-chip"><div class="n">${data.users.pending}</div><div class="l">Pending</div></div>
      <div class="stat-chip"><div class="n">${data.users.inactiveOrExpired}</div><div class="l">Expired/inactive</div></div>
      <div class="stat-chip"><div class="n">R${data.revenue.estimatedMRR}</div><div class="l">Est. MRR</div></div>
      <div class="stat-chip"><div class="n">${data.demoMode ? 'DEMO' : 'LIVE'}</div><div class="l">Mode · AI: ${data.aiConfigured ? 'Gemini' : 'heuristic'}</div></div>
    `;
  }

  async function load() {
    await loadStats();
    const data = await api('/api/admin/subscribers');
    const rows = document.getElementById('rows');
    if (!data.subscribers) { rows.innerHTML = `<tr><td colspan="6">${data.error || 'error'}</td></tr>`; return; }
    rows.innerHTML = data.subscribers.map(s => `
      <tr>
        <td>${s.email}</td>
        <td>${s.plan || '—'}</td>
        <td class="status-${s.status}">${s.status}</td>
        <td>${s.expires_at ? new Date(s.expires_at).toLocaleDateString() : '—'}</td>
        <td>${s.tailorCount ?? 0}</td>
        <td>
          <button data-email="${s.email}" class="act">Activate</button>
          <button data-email="${s.email}" class="danger deact" style="background:linear-gradient(135deg,#ff5d6c,#c23345);">Deactivate</button>
        </td>
      </tr>
    `).join('');
    document.querySelectorAll('.act').forEach(b => b.addEventListener('click', () => activate(b.dataset.email)));
    document.querySelectorAll('.deact').forEach(b => b.addEventListener('click', () => deactivate(b.dataset.email)));
  }

  async function activate(email, plan, days) {
    plan = plan || document.getElementById('quickPlan').value;
    days = days || Number(document.getElementById('quickDays').value || 30);
    await api('/api/admin/activate', { method: 'POST', body: JSON.stringify({ email, days, plan }) });
    load();
  }
  async function deactivate(email) { await api('/api/admin/deactivate', { method: 'POST', body: JSON.stringify({ email }) }); load(); }

  document.getElementById('loadBtn').addEventListener('click', load);
  document.getElementById('activateBtn').addEventListener('click', () => {
    const email = document.getElementById('quickEmail').value.trim();
    if (email) activate(email);
  });
</script>
</body>
</html>
